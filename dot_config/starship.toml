"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
palette = "catppuccin_frappe"
format = "$username$directory$git_branch$git_status$cmd_duration$status$character"

[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"

[username]
show_always = true
format = "[$user](bold rosewater) "

[hostname]
disabled = true

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
home_symbol = "~"
read_only = " "
read_only_style = "bold red"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold flamingo"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold pink"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold mauve"
conflicted = "✖"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "−"
stashed = "$"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

[cmd_duration]
min_time = 2_000
format = "[󰔛 $duration]($style) "
style = "bold red"

[status]
disabled = false
pipestatus = true
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold red"

[character]
success_symbol = "[❯](bold peach)"
error_symbol = "[❯](bold red)"
